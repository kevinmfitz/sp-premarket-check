name: Generate pre-market report

on:
  schedule:
    # 12:45 UTC = 8:45 AM ET during EDT (UTC-4). During EST (UTC-5, roughly
    # early Nov - mid Mar) this runs at 7:45 AM ET instead -- earlier is fine,
    # it just means the report is generated with a bit more lead time.
    - cron: "45 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate report
        run: node generate_report.js

      - name: Commit and push report files
        run: |
          git config user.name "premarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add report.md report.json report.html
          git diff --staged --quiet && echo "No changes" || git commit -m "Auto-generate pre-market report $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

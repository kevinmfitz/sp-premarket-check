name: Generate pre-market report

on:
  schedule:
    # 12:00 UTC = 8:00 AM ET during EDT (UTC-4). During EST (UTC-5, roughly
    # early Nov - mid Mar) this runs at 7:00 AM ET instead -- earlier is fine,
    # it just means more lead time. Scheduled GitHub Actions runs are not
    # guaranteed to fire on time -- delays of 10-60+ min are a known GitHub
    # limitation, not a bug here (observed a 54-min delay on 2026-08-26) --
    # so this is set with a generous 90-min buffer before the 9:30 ET open,
    # and the Claude routine that consumes this also retries if it's stale.
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate report
        run: node generate_report.js

      - name: Commit and push report files
        run: |
          git config user.name "premarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add report.md report.json report.html alert_state.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Auto-generate pre-market report $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

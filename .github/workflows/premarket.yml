name: Generate pre-market report

on:
  schedule:
    # GitHub's `schedule` trigger is best-effort, not guaranteed: runs can be
    # delayed 10-60+ min under load (observed 54 min on 2026-08-26), or
    # dropped entirely (observed a full no-show on 2026-08-27, first day
    # after editing this file's cron -- possibly the documented "editing the
    # workflow resets the schedule" behavior, possibly just load-shedding).
    # Mitigation: three independent attempts spread across the morning
    # instead of relying on one. 12:00/12:20/12:40 UTC = 8:00/8:20/8:40 AM ET
    # during EDT (7:00/7:20/7:40 ET during EST) -- all well before the 9:30
    # open, and each is a full independent run (the second/third just
    # re-generate with the freshest data if the first already succeeded).
    - cron: "0 12 * * 1-5"
    - cron: "20 12 * * 1-5"
    - cron: "40 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate report
        run: node generate_report.js

      - name: Commit and push report files
        run: |
          git config user.name "premarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add report.md report.json report.html alert_state.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Auto-generate pre-market report $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
